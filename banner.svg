<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentGuardX">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#1677ff"/>
      <stop offset="100%" stop-color="#0b3ea8"/>
    </linearGradient>
    <pattern id="tiles" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="url(#blueGrad)"/>
      <path d="M18 0H0V18" fill="none" stroke="#020617" stroke-width="3" opacity="0.55"/>
      <path d="M0 17H18" stroke="#60a5fa" stroke-width="1" opacity="0.28"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#061329" flood-opacity="1"/>
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#0b1120" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="260" fill="transparent"/>
  <g filter="url(#shadow)">
    <text x="50%" y="154" text-anchor="middle"
          font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="118" font-weight="900" letter-spacing="4"
          fill="url(#tiles)" stroke="#0b255c" stroke-width="4" paint-order="stroke fill">
      AGENTGUARDX
    </text>
    <text x="50%" y="154" text-anchor="middle"
          font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif"
          font-size="118" font-weight="900" letter-spacing="4"
          fill="none" stroke="#60a5fa" stroke-width="1.4" opacity="0.65">
      AGENTGUARDX
    </text>
  </g>
</svg>
